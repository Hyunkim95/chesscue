<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#091715" />
    <title>ChessCue is offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #071513;
        color: #f9efda;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        max-width: 34rem;
      }
      p {
        color: #bacbc0;
        line-height: 1.6;
      }
      a {
        display: inline-grid;
        place-items: center;
        min-height: 44px;
        border: 0;
        clip-path: polygon(
          8px 0,
          100% 0,
          100% calc(100% - 8px),
          calc(100% - 8px) 100%,
          0 100%,
          0 8px
        );
        padding: 0 1.25rem;
        color: #122119;
        background: #dfc397;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline.</h1>
      <p>
        ChessCue can still play cached games. Reload after the first
        installation finishes to open the local app.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
