<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101813" />
    <title>ChessCue is offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #eee6d7;
        color: #292a27;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        max-width: 34rem;
      }
      p {
        color: #5f645d;
        line-height: 1.6;
      }
      a {
        display: inline-grid;
        place-items: center;
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        padding: 0 1.25rem;
        color: #f8f1e5;
        background: #3d6b5a;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline.</h1>
      <p>
        ChessCue can still play cached games. Reload after the first
        installation finishes to open the local app.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
