<!doctype html>
<html lang="en">
  <head>

    <meta name="theme-color" content="#091715" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta

      body:has(.launch-state) {
        margin: 0;
        background: #071513;

        display: grid;
        min-height: 100dvh;

          500 1.25rem Georgia,
          serif;

    <div id="root">
      <main class="launch-state" role="status">
        <img src="/favicon.svg" alt="" width="48" height="48" />

      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
