<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#091715" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="ChessCue turns complete chess games into adaptive training."
    />
    <style>
      /* SLO-014: the shape of the first screen paints before any script. */
      body:has(.launch-state) {
        margin: 0;
        background: #071513;
      }
      .launch-state {
        box-sizing: border-box;
        display: grid;
        align-content: start;
        gap: 14px;
        width: min(100%, 560px);
        min-height: 100dvh;
        margin-inline: auto;
        padding: 16px;
      }
      .launch-state__bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .launch-state i {
        display: block;
        border-radius: 999px;
        background:
          linear-gradient(
              100deg,
              transparent 30%,
              rgb(249 239 218 / 7%) 50%,
              transparent 70%
            )
            0 0 / 220% 100%,
          #16302a;
        animation: launch-shimmer 1.4s linear infinite;
      }
      .launch-state .launch-state__board {
        aspect-ratio: 1;
        border-radius: 16px;
        background: conic-gradient(
            #16302a 25%,
            #10231f 0 50%,
            #16302a 0 75%,
            #10231f 0
          )
          0 0 / 25% 25%;
        box-shadow: inset 0 0 0 1px #2c4a41;
        animation: none;
      }
      .launch-state__hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @keyframes launch-shimmer {
        from {
          background-position-x: 110%;
        }
        to {
          background-position-x: -110%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .launch-state i {
          animation: none;
        }
      }
    </style>
    <title>ChessCue</title>
  </head>
  <body>
    <div id="root">
      <main class="launch-state" role="status">
        <span class="launch-state__hidden">Opening ChessCue…</span>
        <span class="launch-state__bar" aria-hidden="true">
          <i style="width: 96px; height: 32px"></i>
          <i style="width: 44px; height: 44px"></i>
        </span>
        <i style="width: 55%; height: 28px" aria-hidden="true"></i>
        <i class="launch-state__board" aria-hidden="true"></i>
        <i style="width: 80%; height: 12px" aria-hidden="true"></i>
        <i style="width: 60%; height: 12px" aria-hidden="true"></i>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
